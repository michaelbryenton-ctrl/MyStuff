name: Android release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-release.yml"
      - "android/**"
      - "vendor/xroar/**"
      - "docs/android-user-guide.html"
      - "docs/releases/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version, source tag, and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -s "docs/releases/$version.md" ]]
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if ! git diff --quiet "$tag" HEAD -- android/app vendor/xroar docs/android-user-guide.html; then
              echo "::error::App or guide changed under existing tag $tag. Increase versionName/versionCode and update the guide/release notes."
              exit 1
            fi
          fi
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .draft")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$draft" == "false" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published; leaving it unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore original signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "::error::Original signing-key secret is missing."; exit 1; }
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
      - name: Install exact Android SDK packages and PDF tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Run Android regression checks
        shell: bash
        run: |
          set -euo pipefail
          for test in display-sizing touch-joystick gamepad media-and-bezel launch-config keyboard-input cassette-saving; do
            bash "android/test-$test.sh"
          done
      - name: Build all four ABIs and validate pinned signer
        working-directory: android
        run: bash gradlew --no-daemon --max-workers=2 assembleDebug
      - name: Package APK and render user guide
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "generated-artifacts/android/xroar-$VERSION-debug.apk"
          chrome="$(command -v google-chrome || command -v chromium)"
          "$chrome" --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="$PWD/generated-artifacts/android/xroar-$VERSION-user-guide.pdf" \
            "file://$PWD/docs/android-user-guide.html"
          pdfinfo "generated-artifacts/android/xroar-$VERSION-user-guide.pdf" \
            | grep -F "XRoar Android $VERSION"
      - name: Verify update compatibility against the latest published APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous-apk"
          previous="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '[.[] | select(.draft == false and .prerelease == false)][0].assets[]? | select(.name | endswith("-debug.apk")) | .name' | head -1)"
          if [[ -n "$previous" ]]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "$previous" --dir "$RUNNER_TEMP/previous-apk"
            bash android/test-apk-update.sh "generated-artifacts/android/xroar-$VERSION-debug.apk" \
              "$RUNNER_TEMP/previous-apk/$previous"
          else
            bash android/test-apk-update.sh "generated-artifacts/android/xroar-$VERSION-debug.apk"
          fi
      - name: Save downloadable build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xroar-${{ env.VERSION }}
          path: generated-artifacts/android/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload, verify downloads, and publish
        run: bash android/ci-publish-release.sh
      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: rm -f "$HOME/.android/debug.keystore"
