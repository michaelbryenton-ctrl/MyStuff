plugins {
    id 'com.android.application'
}

android {
    namespace = "org.xroar.android"
    compileSdkVersion 35
    buildToolsVersion "35.0.0"
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "org.xroar.android"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 8
        versionName "1.0.7"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21"
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation files("libs/SDL3-3.4.18.aar")
}

// A task copy may have a different automatically generated debug keystore.
// Never distribute such an APK as an update to the installed app: Android
// rejects a different signer, and uninstalling erases imported ROMs/media.
// This file contains only the public certificate fingerprint, not a key.
def signingIdentityCheck = tasks.register("verifyDebugSigningIdentity") {
    group = "verification"
    description = "Require the same signing certificate as the distributed debug APK."
    dependsOn("validateSigningDebug")
    doLast {
        def config = android.signingConfigs.getByName("debug")
        def store = java.security.KeyStore.getInstance(
                config.storeFile, config.storePassword.toCharArray())
        def certificate = store.getCertificate(config.keyAlias)
        if (certificate == null) {
            throw new GradleException("The debug signing certificate is missing.")
        }
        def actual = java.security.MessageDigest.getInstance("SHA-256")
                .digest(certificate.encoded).encodeHex().toString()
        def expected = file("debug-signing-certificate.sha256").text.trim()
        if (actual != expected) {
            throw new GradleException(
                    "This workspace has a different debug signing key. Android would reject " +
                    "this APK as an update. Build the distributable APK in the original " +
                    "workspace with its existing keystore, or securely restore that same key. " +
                    "Do not regenerate the key or change the pinned certificate to bypass this check.")
        }
    }
}
tasks.matching { it.name == "packageDebug" }.configureEach {
    dependsOn(signingIdentityCheck)
}
